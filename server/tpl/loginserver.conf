<server>
	<Main>
		MaxClient = 1000		# 最大同时客户端连接数
		MaxAdmin = 10			# 最大同时管理端口连接数
		TimeOut = 360           # 秒
		RecvBufferSize = 10240	# 每个客户端连接上的RecvBuffer大小(bytes)，需要大于业务数据包的最大包长，否则可能接收不了
		SendBufferSize = 10240	# 每个客户端连接上的SendBuffer大小
	</Main>

	<Log>
		Name = {{ log_dir }}/syslog/sys_svc
		Size = 104857600 #100M
		Num = 200
		Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
	</Log>


	<Privilege>
		#定义ip访问权限,可定义多个规则(自定义名称),在不同的绑定端口上可以使用不同的规则
		#可使用kill -s USR1 pid来动态加载(不支持动态增加规则项)
		<admin_rule>
			order = allow,deny
			allow = 192.168.1.*,10.3.*.*
			deny = 192.168.2.*
		</admin_rule>

		<outer_rule>
			order = allow,deny
			allow = *.*.*.*
			deny = 172.16.*.*
		</outer_rule>
	</Privilege>

	<Service>
		<1>
			BindIp =  0.0.0.0 
			BindPort = {{ port }} #自己的端口  #(需要修改)
			SockType = tcp				
			IFType = bin					
			Privilege = admin_rule 	
            websocket = true
		</1>

		<Admin>
			# Admin是特殊的管理端口,必须为tcp
			BindIp = 127.0.0.1 
			BindPort = {{ admin_port }}  #(需要修改)
			SockType = tcp
			IFType = Line
			Privilege = admin_rule		
		</Admin>
	</Service>


</server>

<loginserver>
     <dayLog>
         LogDir ={{ log_dir }}/daylog/
         MaxSize = 2000000000
         Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
         <newplayerrecord>
             LogName = newplayerrecord.log
         </newplayerrecord>
      	 <pipregconnrecord>
          	LogName = pipregconnrecord.log
         </pipregconnrecord>
         <playerloginrecord>
            LogName = playerloginrecord.log
        </playerloginrecord>
         #用户账号注册记录
         <AccountRegLog>
               LogName = account_reg
         </AccountRegLog>
         #用户登录登出操作
         <AccountActLog>
               LogName = account_act
         </AccountActLog>
		 #角色创建日志
         <RoleRegLog>
               LogName = role_reg
         </RoleRegLog>
         #角色登录登出日志
         <RoleActLog>
               LogName = role_act
         </RoleActLog>
     </dayLog>
	 
	 <operateLog>
         LogDir ={{ operate_log_path }}
         MaxSize = 2000000000
         Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)

         #用户账号注册记录
         <AccountRegLog>
               LogName = account_reg_log
         </AccountRegLog>
         #用户登录登出操作
         <AccountActLog>
               LogName = account_act_log
         </AccountActLog>

     </operateLog>
     <RollLog>
      	Name = {{ log_dir }}/syslog/sys_loginserver
      	Size = 104857600 #100M
      	Num = 200
      	Level = 4 # log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
     </RollLog>
     <pidLog>
        Name = {{ log_dir }}/loginserver.pid
     </pidLog>
     <svrinfo>
     	#处理的协议号
        msglist = {{ msglist }}
        #本服务的id
        svrid = {{ svrid }}
		#测试服开关 1是测试服 0正式服
        testopen = {{ testopen }} 
     </svrinfo>
</loginserver>

<database>
    host        {{ db_host }}
    port        {{ db_port }}
    dbname      {{ db_name }}  #(需要修改)
    user        {{ db_user }}  #(需要修改)
    password    {{ db_password }}  #(需要修改)
    threadNum_init  1
    #数据库连接池数量 必须比线程数2倍大于4
    threadNum_ar   20
</database>
<redis>
    host {{ redis_host }}
    port {{ redis_port }}    #(需要修改)
    dbname  {{ db_name }}  #(需要修改)
    usepwd {{ redis_usepsw }}
    passwd {{ redis_password }}
</redis>
<sharememory>
   shmkey {{ shmkey }} #(需要修改)
   semkey {{ semkey }} #(需要修改)
   total {{ shm_total }}
   block {{ shm_block }}
</sharememory>

<sdkadmin>
    checklogin_host  {{ msdk_host }}/open/validSign
    android_checklogin_host {{ csdk_host }}/open/validSign
	get_msdk_host {{ csdk_host }}/userChange/getMsdkId
	getusermobile_host {{ msdk_host }}/sapi/user/gameBind/getUserMobile
	savebindphone_host {{ msdk_host }}/sapi/user/gameBind/saveBindPhone
	check_mobile_appid {{ check_mobile_appid }}
	check_mobile_appkey {{ check_mobile_appkey }}
</sdkadmin>
