<dbserver>
    <Log>
 	    Name = {{ log_dir }}/syslog/sys_dbserver
	    Size = 104857600 #100M
	    Num = 100
	    Level = 4	  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
     </Log>
    
    <dayLog>
        LogDir = {{ log_dir }}/daylog/
        MaxSize = 2000000000
        Level = 3  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)

        <executesqldb>
              LogName = executesqldb.log
        </executesqldb>
        <allsqldb>
              LogName = allsqldb.log
        </allsqldb>
     </dayLog>
     <pidLog>
        Name = {{ log_dir }}/dbserver.pid
     </pidLog>
     
     #线程数量，下面的数据库连接池数量必须比线程数2倍大于4
     threads    4
</dbserver>

<database>
    host        {{ db_host }}
    port        {{ db_port }}
    dbname      {{ db_name }}  #(需要修改)
    user        {{ db_user }}  #(需要修改)
    password    {{ db_password }}  #(需要修改)

    threadNum_init  4
    #数据库连接池数量 必须比线程数2倍大于4
    threadNum_ar   10
</database>
<sharememory>
   shmkey {{ shmkey }}  #(需要修改)
   semkey {{ semkey }}  #(需要修改)
   total {{ shm_total }}
   block {{ shm_block }}
</sharememory>
<redis>
    host {{ redis_host }}
    port {{ redis_port }}    #(需要修改)
    dbname {{ db_name }}  #(需要修改)
    usepwd {{ redis_usepsw }}
    passwd {{ redis_password }}
</redis>
