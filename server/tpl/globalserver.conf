<server>
	<Main>
		MaxClient = 1000		# 最大同时客户端连接数
		MaxAdmin = 10			# 最大同时管理端口连接数
		TimeOut = 1000           # 秒
		RecvBufferSize = 10240	# 每个客户端连接上的RecvBuffer大小(bytes)，需要大于业务数据包的最大包长，否则可能接收不了
		SendBufferSize = 50000	# 每个客户端连接上的SendBuffer大小
	</Main>

	<Log>
		Name = {{ log_dir }}/syslog/sys_svc
		Size = 104857600 #100M
		Num = 100
		Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
	</Log>

	<Privilege>
		#定义ip访问权限,可定义多个规则(自定义名称),在不同的绑定端口上可以使用不同的规则
		#可使用kill -s USR1 pid来动态加载(不支持动态增加规则项)
		<admin_rule>
			order = allow,deny
			allow = 192.168.1.*,10.3.*.*
			deny = 192.168.2.*
		</admin_rule>

		<outer_rule>
			order = allow,deny
			allow = *.*.*.*
			deny = 172.16.*.*
		</outer_rule>
	</Privilege>

	<Service>
		<1>
			BindIp = 0.0.0.0 
			BindPort = {{ port }} #自己的端口  #(需要修改)
			SockType = tcp				
			IFType = bin					
			Privilege = admin_rule 	
			websocket = true
		</1>

		<Admin>
			# Admin是特殊的管理端口,必须为tcp
			BindIp = 127.0.0.1 
			BindPort = {{ admin_port }}  #(需要修改)
			SockType = tcp
			IFType = Line
			Privilege = admin_rule		
		</Admin>
	</Service>
</server>

<globalserver>
     <dayLog>
         LogDir = {{ log_dir }}/daylog/
         MaxSize = 2000000000
         Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
         <newplayerrecord>
             LogName = newplayerrecord.log
         </newplayerrecord>
      	 <pipregconnrecord>
          	LogName = pipregconnrecord.log
         </pipregconnrecord>
         <connecttimerecord>
            LogName = connecttimerecord.log
         </connecttimerecord>
     </dayLog>


     <operateLog>
         LogDir ={{ operate_log_path }}
         MaxSize = 2000000000
         Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG #(需要修改)
         #用户账号注册记录
         
         #排行榜日志
         <RankLog>
               LogName = ranking_list_log
         </RankLog>

     </operateLog>    

     <RollLog>
      	Name = {{ log_dir }}/syslog/sys_globalserver
      	Size = 104857600 #100M
      	Num = 200
      	Level = 3 # log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
     </RollLog>
     <pidLog>
        Name = {{ log_dir }}/globalserver.pid
     </pidLog> 
	 <svrInfo>	 
		SVRID= {{ svrid }}
		msgList= {{ msglist }}
	 </svrInfo>
	 <thrift>
        ip    {{ global_thrift_host }}
        port  {{ global_thrift_port }}
        threadnum  2 
     </thrift>
</globalserver>

<database>
	host						{{ db_host }}
	port						{{ db_port }}
	dbname						{{ db_name }}
	user						{{ db_user }}
	password					{{ db_password }}
	threadNum_init				4
	threadNum_ar				10
</database>

<redis>
    host {{ redis_host }}
    port {{ redis_port }}    #(需要修改)
    dbname  {{ db_name }}  #(需要修改)
    usepwd {{ redis_usepsw }}
    passwd {{ redis_password }}
</redis>

<sharememory>
   shmkey {{ shmkey }} #(需要修改)
   semkey {{ semkey }} #(需要修改)
   total {{ shm_total }}
   block {{ shm_block }}
</sharememory>
