<server>
	<Main>
		MaxClient = 100		# 最大同时客户端连接数###
		MaxAdmin = 10	    # 最大同时管理端口连接数
		TimeOut = 1000		
		RecvBufferSize = 10240	# 每个客户端连接上的RecvBuffer大小(bytes)，需要大于业务数据包的最大包长，否则可能接收不了
		SendBufferSize = 50000	# 每个客户端连接上的SendBuffer大小

		VerifyKey = bdyld_release  # 平台验证密钥
	</Main>

	<Log>
		Name = {{ log_dir }}/syslog/sys_svc
		Size = 104857600 #100M
		Num = 100
		Level = 3   # log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
	</Log>

	<Privilege>
		<admin_rule>
			order = allow,deny
			allow = 192.168.1.*,10.3.*.*
			deny = 192.168.2.*
		</admin_rule>
		<outer_rule>
			order = allow,deny
			allow = *.*.*.*
			deny = 172.16.*.*
		</outer_rule>
	</Privilege>

	<Service>
		<1>
			BindIp = 0.0.0.0 
			BindPort = {{ port }}  #(需要修改)
			SockType = tcp				
			IFType = bin					
			LenOffSet = 0
			LenType = int
			LenInclude = true	
			LenByteOrder = true
			Privilege = admin_rule 	
		</1>
		<Admin>
			# Admin是特殊的管理端口,必须为tcp  php连接的，例如充值，发邮件等
			BindIp = 0.0.0.0  
			BindPort = {{ admin_port }}  #(需要修改)
			SockType = tcp
			IFType = Line
			Privilege = admin_rule		
		</Admin>
	</Service>

</server>

<zeus>
     threads   2 
	 maxuser    3000 #玩家对象池大小
    <Log>
 	    Name = {{ log_dir }}/syslog/sys_gameserver
	    Size = 209715200 #100M 104857600
	    Num = 200
	    Level = 3	  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
     </Log>
     <pidLog>
        Name = {{ log_dir }}/gameserver.pid
     </pidLog>
    
	 <RechargeLog>
        Name = ./sys_recharge
        Size = 104857600 #100M
        Num = 100
        Level = 4  #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
    </RechargeLog>
	
    <dayLog>
        LogDir = {{ log_dir }}/daylog/
        MaxSize = 2000000000
        Level = 4 #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
        <threadmonitor>
            LogName = threadmonitor
        </threadmonitor>
		<timerhandller>
            LogName = timmerMonitor    
        </timerhandller>
    </dayLog>
    <sdkdayLog>
         LogDir = {{ operate_log_path }}
         MaxSize = 2000000000
         Level = 4 #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
         <threadmonitor>
             LogName = threadmonitor
         </threadmonitor>
         <timerhandller>
             LogName = timmerMonitor
         </timerhandller>
    </sdkdayLog>

     
    <MonitorLog>
        LogDir = {{ log_dir }}/Monitor/
        MaxSize = 200000000
        Level = 4 #log级别 0：NO_LOG 1:FATAL_LOG 2:ERROR_LOG,3:NORMAL_LOG,4:DEBUG_LOG  #(需要修改)
        LogName = monitor
    </MonitorLog>

    <checkword>
        ValuePath = ../data/wordvalue.dat
        VectorPath = ../data/triearray.dat
        MapInfoPath = ../data
     </checkword>

	<svrInfo>
		svrid= {{ svrid }} #游戏服id，注意每个游戏服id必须不一样！(需要修改)
		isdefaultsvr = {{ isdefaultsvr }} #是否默认游戏服，注意全服只有一个默认游戏服，一般是第一个 0否 1是 (需要修改)
		msgList= {{ msglist }}
		open= {{ open }} #开服状态 1开服 0关服，0代表该服准备关闭，网关不会把新玩家导到这个服
        maxLoad={{max_load}}
	 </svrInfo>
	
    pythonsupport 1 #是否支持python
</zeus>

<redis>
    host {{ redis_host }} 
    port {{ redis_port }}  #(需要修改)
    dbname {{ db_name }}  #(需要修改) 全服的redis的dbname必须一致，关系到uid svrid defaultsvrid的存取
    usepwd {{ redis_usepsw }}
    passwd {{ redis_password }}
</redis>


<sharememory>
   shmkey {{ shmkey }} #(需要修改)
   semkey {{ semkey }} #(需要修改)
   total {{ shm_total }}
   block {{ shm_block }}
</sharememory>


